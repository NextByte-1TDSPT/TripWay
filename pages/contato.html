<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>TripWay - Contato</title>
  </head>

  <body style="font-family: Poppins">
    <nav>
      <a href="../index.html">
        <img src="../images/logo.jpeg" alt="TripWay" />
      </a>

      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="./destinos.html">Destinos</a></li>
        <li><a href="./pacotes.html">Pacotes</a></li>
        <li><a href="./contato.html">Contato</a></li>
      </ul>
    </nav>

    <main>
      <section>
        <h1>Simule sua Reserva</h1>
        <p>Preencha o formulário abaixo para solicitar um orçamento.</p>

        <img
          src="../images/contato.jpg"alt="Pessoa entrando em contato por telefone"/>

        <form action="">
          <p>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" placeholder="Ex: Maria Silva" />
          </p>

          <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Ex: maria@email.com" />
          </p>

          <p>
            <label for="destino">Destino de Interesse:</label>

            <select id="destino">
              <option value="praia">Praia</option>
              <option value="montanha">Montanha</option>
              <option value="cidade">Cidade Histórica</option>
            </select>
          </p>

          <p>
            <label for="data">Data Pretendida:</label>
            <input type="date" id="data" />
          </p>

          <p>
            <label for="pessoas">Quantidade de Pessoas:</label>
            <input type="number" id="pessoas" placeholder="Ex: 2" />
          </p>

          <p>
            <label for="mensagem">Mensagem:</label>
            <br />
            <textarea
              id="mensagem"
              placeholder="Digite uma mensagem ou observação sobre sua viagem"
            ></textarea>
          </p>

          <button type="submit">Enviar Solicitação</button>
        </form>

        <p>
          <a href="../index.html">Voltar para a Home</a>
        </p>
      </section>
    </main>

    <footer>
      <p>© 2026 TripWay</p>
    </footer>
  </body>
</html>
